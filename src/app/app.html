<app-header></app-header>
<app-navbar></app-navbar>

<main>
  <section>
    <app-conference-list (conferenceSelected)="onConferenceSelected($event)"></app-conference-list>
    <app-conference-form [conference]="editing()" (finished)="editing.set(null)"></app-conference-form>
  </section>

  <aside>
    <app-user-profile></app-user-profile>
    <app-notifications></app-notifications>
    <app-conference-detail [conference]="selectedConference()" (edit)="startEdit($event)"></app-conference-detail>
    <app-friend-list></app-friend-list>
  </aside>
</main>

<app-footer></app-footer>
